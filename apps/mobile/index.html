<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Sovereign Wallet — Mode A (Wavelength/Ark) web preview on regtest with a simulated client. No real bitcoin." />
    <title>Sovereign Wallet — Mode A preview (regtest)</title>
    <style>
      /* Colors are the --sovl-* tokens from @sovereign/ui (bg, sidebar, border, warning, accent). */
      html, body { margin: 0; height: 100%; background: #0b0d12; }
      body {
        display: flex; flex-direction: column; align-items: center;
        font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .demo-bar {
        flex: none; width: 100%; box-sizing: border-box; padding: 6px 16px;
        background: #10131a; border-bottom: 1px solid #232a36;
        color: #d4a548; font-size: 12px; line-height: 1.4; text-align: center;
      }
      .demo-bar a { color: #f7931a; }
      #root {
        flex: 1; min-height: 0; width: 100%; max-width: 430px;
        display: flex; flex-direction: column;
        border-left: 1px solid #232a36; border-right: 1px solid #232a36; box-sizing: border-box;
      }
      @media (max-width: 430px) { #root { border: 0; } }
    </style>
  </head>
  <body>
    <div class="demo-bar" role="note">
      Demo build · regtest · <span id="demo-backend">simulated Wavelength client</span> — no real bitcoin, no network calls.
      <a href="https://github.com/pauloes-btechs/sovereign-wallet" rel="noopener noreferrer">Source</a>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/preview.tsx"></script>
  </body>
</html>
