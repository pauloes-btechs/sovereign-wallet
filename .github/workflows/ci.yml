name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace packages publish their .d.ts under dist/ — build first or
      # typecheck fails with TS2307 on a fresh checkout (no dist to resolve).
      - run: pnpm build
      - run: pnpm typecheck

  build-and-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  fuzz:
    name: Fuzz (destination, invoice, asset-id, listen-args parsers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # CI budget: 100k iterations per seed — 4x the local default. Seeds are
      # fixed, so a failure is reproducible by re-running with the same seed
      # and a higher FUZZ_ITERATIONS locally.
      - run: pnpm test
        env:
          FUZZ_ITERATIONS: '100000'

  integration:
    name: Integration (regtest harness)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Checksum-verified litd sidecar for the integration suite.
      - run: pnpm sidecar:fetch
      # btcd (pinned v0.26.2) is the BIP157 filter source for the Neutrino
      # sidecar test — bitcoind cannot serve compact filters. Built here and
      # spawned host-side by the harness CLI (see harness/regtest/README.md).
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go install github.com/btcsuite/btcd@v0.26.2
      - name: Boot the regtest harness
        run: |
          # Pre-create bind-mount host dirs: docker creates them as root,
          # which locks out both the runner user and the container's
          # non-root bitcoin user. bitcoind's dir gets 0777 so any
          # container uid can write it; the runner owns the parent.
          mkdir -p harness/regtest/data/bitcoind harness/regtest/data/lnd-alice \
            harness/regtest/data/lnd-bob harness/regtest/data/litd-lnd \
            harness/regtest/data/litd-lit harness/regtest/data/btcd \
            harness/regtest/data/btcd-log
          chmod 0777 harness/regtest/data/bitcoind
          docker compose -f harness/regtest/docker-compose.yml up -d --wait
          # The runner needs write access for the host-side btcd helper and
          # read access for node TLS certs + macaroons (mode 0600 in the
          # containers). bitcoind's datadir is excluded: it belongs to the
          # container's non-root user and is never read from the host.
          for d in lnd-alice lnd-bob litd-lit; do
            sudo chown -R "$(id -u):$(id -g)" "harness/regtest/data/$d"
          done
          # litd's terminal healthcheck does not cover its embedded LND,
          # whose tls.cert can land well after `compose --wait` returns
          # (bootstrap's own wait window then expires: ENOENT tls.cert).
          # Wait up to 180s for the cert before handing litd-lnd to the
          # runner user; on timeout, fail loudly so the compose-logs step
          # captures the embedded-LND state.
          for i in $(seq 1 90); do
            [ -f harness/regtest/data/litd-lnd/tls.cert ] && break
            sleep 2
          done
          [ -f harness/regtest/data/litd-lnd/tls.cert ] || {
            echo "::error::litd embedded-LND tls.cert did not appear within 180s; see compose logs above"
            exit 1
          }
          sudo chown -R "$(id -u):$(id -g)" harness/regtest/data/litd-lnd
      - name: Harness container logs (on failure)
        if: failure()
        run: docker compose -f harness/regtest/docker-compose.yml logs --tail=200
      - name: Bootstrap seed chain + node wallets (spawns the btcd filter server)
        run: SOVEREIGN_BTCD_BIN="$(go env GOPATH)/bin/btcd" pnpm harness:bootstrap
      - name: Hand container-created files to the runner user
        if: success()
        run: |
          # Wallet init inside the containers just wrote macaroons (0600,
          # root-owned) into the bind mounts; the runner-user integration
          # tests read them.
          for d in lnd-alice lnd-bob litd-lnd litd-lit; do
            sudo chown -R "$(id -u):$(id -g)" "harness/regtest/data/$d"
          done
      - name: Run integration suite
        run: pnpm test:integration
      - name: Teardown
        if: always()
        run: docker compose -f harness/regtest/docker-compose.yml down -v || true

  recovery:
    name: Recovery drills (release-blocking)
    # The spec's merge gate: a wallet build is releasable only when every
    # recovery drill is green. Each drill builds its own disposable node
    # state on the shared compose harness (wiping and re-initializing real
    # LND/tapd daemons) and records evidence to docs/TEST_RESULTS.md.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Checksum-verified litd sidecar binary — the asset-restore drill boots
      # two REAL litd daemons (integrated tapd) over Neutrino.
      - run: pnpm sidecar:fetch
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go install github.com/btcsuite/btcd@v0.26.2
      # Same disposable regtest boot as the integration job. The drills go
      # further: they stop/wipe/re-init the compose nodes mid-run, reading
      # credentials container-side so re-created root-owned files never race
      # host-side reads.
      - name: Boot the regtest harness
        run: |
          mkdir -p harness/regtest/data/bitcoind harness/regtest/data/lnd-alice \
            harness/regtest/data/lnd-bob harness/regtest/data/litd-lnd \
            harness/regtest/data/litd-lit harness/regtest/data/btcd \
            harness/regtest/data/btcd-log
          chmod 0777 harness/regtest/data/bitcoind
          docker compose -f harness/regtest/docker-compose.yml up -d --wait
          for d in lnd-alice lnd-bob litd-lit; do
            sudo chown -R "$(id -u):$(id -g)" "harness/regtest/data/$d"
          done
          for i in $(seq 1 90); do
            [ -f harness/regtest/data/litd-lnd/tls.cert ] && break
            sleep 2
          done
          [ -f harness/regtest/data/litd-lnd/tls.cert ] || {
            echo "::error::litd embedded-LND tls.cert did not appear within 180s"
            exit 1
          }
          sudo chown -R "$(id -u):$(id -g)" harness/regtest/data/litd-lnd
      - name: Harness container logs (on failure)
        if: failure()
        run: docker compose -f harness/regtest/docker-compose.yml logs --tail=200
      - name: Bootstrap seed chain + node wallets (spawns the btcd filter server)
        run: SOVEREIGN_BTCD_BIN="$(go env GOPATH)/bin/btcd" pnpm harness:bootstrap
      - name: Hand container-created files to the runner user
        if: success()
        run: |
          for d in lnd-alice lnd-bob litd-lnd litd-lit; do
            sudo chown -R "$(id -u):$(id -g)" "harness/regtest/data/$d"
          done
      - name: Run recovery drill suite
        run: pnpm test:recovery
      - name: Upload drill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-drill-results
          path: |
            harness/recovery/results/drill-results.jsonl
            docs/TEST_RESULTS.md
          if-no-files-found: warn
      - name: Teardown
        if: always()
        run: docker compose -f harness/regtest/docker-compose.yml down -v || true

  modeb-e2e:
    name: Mode B desktop e2e (real litd sidecar)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Checksum-verified litd sidecar binary the bridge launches (Neutrino).
      - run: pnpm sidecar:fetch
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go install github.com/btcsuite/btcd@v0.26.2
      # Same regtest boot as the integration job — the e2e daemon harness
      # reuses it (its own bootstrap starts the btcd filter server again,
      # which is idempotent against the already-running bitcoind).
      - name: Boot the regtest harness
        run: |
          mkdir -p harness/regtest/data/bitcoind harness/regtest/data/lnd-alice \
            harness/regtest/data/lnd-bob harness/regtest/data/litd-lnd \
            harness/regtest/data/litd-lit harness/regtest/data/btcd \
            harness/regtest/data/btcd-log
          chmod 0777 harness/regtest/data/bitcoind
          docker compose -f harness/regtest/docker-compose.yml up -d --wait
          for d in lnd-alice lnd-bob litd-lnd litd-lit; do
            sudo chown -R "$(id -u):$(id -g)" "harness/regtest/data/$d"
          done
          for i in $(seq 1 90); do
            [ -f harness/regtest/data/litd-lnd/tls.cert ] && break
            sleep 2
          done
          [ -f harness/regtest/data/litd-lnd/tls.cert ] || {
            echo "::error::litd embedded-LND tls.cert did not appear within 180s"
            exit 1
          }
          sudo chown -R "$(id -u):$(id -g)" harness/regtest/data/litd-lnd
      - name: Harness container logs (on failure)
        if: failure()
        run: docker compose -f harness/regtest/docker-compose.yml logs --tail=200
      - name: Seed chain + node wallets (spawns the btcd filter server)
        run: SOVEREIGN_BTCD_BIN="$(go env GOPATH)/bin/btcd" pnpm harness:bootstrap
      - name: Hand container-created files to the runner user
        if: success()
        run: |
          for d in lnd-alice lnd-bob litd-lnd litd-lit; do
            sudo chown -R "$(id -u):$(id -g)" "harness/regtest/data/$d"
          done
      - name: Install Playwright Chromium
        run: pnpm --filter @sovereign/desktop exec playwright install --with-deps chromium
      # Playwright's webServer boots the e2e daemon harness (bridge process
      # + fresh Neutrino litd sidecar + vite with the /modeb proxy).
      # SOVEREIGN_BTCD_BIN is inherited by the daemon harness, which starts
      # the filter server the sidecar's Neutrino sync depends on.
      - name: Run Mode B e2e
        # `run` (not the bare form): a missing script must FAIL the job —
        # pnpm's bare --filter form exits 0 when no package has the script.
        run: SOVEREIGN_BTCD_BIN="$(go env GOPATH)/bin/btcd" pnpm --filter @sovereign/desktop run test:e2e:modeb
      - name: Visual evidence captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modeb-e2e-evidence
          path: apps/desktop/test-results/modeb-evidence/
          retention-days: 7
      - name: Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: modeb-e2e-traces
          path: apps/desktop/test-results/
          retention-days: 7
      - name: Teardown
        if: always()
        run: docker compose -f harness/regtest/docker-compose.yml down -v || true

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --prod --audit-level=high

  waved-integration:
    name: waved integration (real daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch + hash-verify + smoke waved v0.2.0
        run: node scripts/fetch-waved.mjs --triple=x86_64-unknown-linux-gnu
      # The lifecycle integration tests import the Wavelength adapter
      # (@sovereign/wavelength-adapter), which resolves to built dist/.
      - name: Build workspace
        run: pnpm -r build
      - name: Boot real waved through the lifecycle engine
        run: pnpm --filter @sovereign/daemon-lifecycle exec vitest run

  desktop-artifacts:
    name: Desktop dev artifacts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: macos-15-intel
            triple: x86_64-apple-darwin
          # Best-effort tier per spec: built if cheap, never a release
          # blocker — a failed Linux lane is reported but cannot fail CI.
          # Pinned to 24.04: ubuntu-latest resolves to 26.04, where the
          # appindicator/GTK dev package set is uninstallable (unmet deps).
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
            bestEffort: true
    continue-on-error: ${{ matrix.bestEffort == true }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      # Tauri 2 Linux system dependencies (best-effort lane only).
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev
      - name: Fetch + hash-verify waved for this target
        run: node scripts/fetch-waved.mjs --triple=${{ matrix.triple }}
      - name: Fetch + hash-verify litd for this target
        run: node scripts/fetch-sidecars.mjs --triple=${{ matrix.triple }}
      # generate_context! reads the frontend dist at compile time; the cargo
      # test step does not build the UI, so stub it (the real bundle step
      # below regenerates the actual dist via beforeBuildCommand).
      - name: Stub frontend dist for tauri codegen
        run: mkdir -p apps/desktop/dist && echo '<html></html>' > apps/desktop/dist/index.html
        shell: bash
      # SQLCipher-at-rest tests run on every matrix target; the keyring
      # round-trip test activates on macOS (Keychain) and Windows
      # (Credential Manager) via its own cfg gate.
      - name: Rust tests (SQLCipher + per-platform keyring)
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - name: Build debug bundle (dev artifact, unsigned)
        run: pnpm --filter @sovereign/desktop tauri build --debug
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-wallet-dev-${{ matrix.triple }}
          path: apps/desktop/src-tauri/target/debug/bundle/
          retention-days: 7
      # ---- Install smoke tests: install each artifact the way a user would
      # (silent install / dmg copy) and assert the app + both sidecars landed.
      # Unsigned by design — no signing credentials exist (docs/RELEASE.md).
      - name: Install smoke test (NSIS + MSI silent install)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'apps/desktop/src-tauri/target/debug/bundle'
          $nsis = Get-ChildItem "$bundle/nsis/*-setup.exe" | Select-Object -First 1
          $msi = Get-ChildItem "$bundle/msi/*.msi" | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not found in $bundle/nsis" }
          if (-not $msi) { throw "MSI installer not found in $bundle/msi" }
          # NSIS silent install; the installer process exits 0 only on success.
          $p = Start-Process -Wait -PassThru -FilePath $nsis.FullName -ArgumentList '/S'
          if ($p.ExitCode -ne 0) { throw "NSIS install failed: exit $($p.ExitCode)" }
          # MSI silent install with verbose log on failure.
          $msiLog = Join-Path $env:TEMP 'sovereign-msi-install.log'
          $p = Start-Process -Wait -PassThru -FilePath 'msiexec.exe' `
            -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/norestart', "/L*v", "`"$msiLog`""
          if ($p.ExitCode -ne 0) {
            if (Test-Path $msiLog) { Get-Content $msiLog -Tail 40 }
            throw "MSI install failed: exit $($p.ExitCode)"
          }
          # Locate the installed app: Tauri installs to %LOCALAPPDATA%\<product>
          # (NSIS) or %PROGRAMFILES%\<product> (MSI per-machine) — check known
          # roots before falling back to a recursive search.
          $candidates = @(
            "$env:LOCALAPPDATA\Sovereign Wallet",
            "$env:LOCALAPPDATA\Programs\Sovereign Wallet",
            "$env:ProgramFiles\Sovereign Wallet"
          )
          $installDir = $candidates | Where-Object { Test-Path "$_\Sovereign Wallet.exe" } | Select-Object -First 1
          if (-not $installDir) {
            $exe = Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter 'Sovereign Wallet.exe' `
              -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($exe) { $installDir = $exe.DirectoryName }
          }
          if (-not $installDir) { throw "installed executable 'Sovereign Wallet.exe' not found" }
          foreach ($sidecar in 'litd.exe', 'waved.exe') {
            if (-not (Test-Path (Join-Path $installDir $sidecar))) {
              throw "$sidecar sidecar missing from installed app at $installDir"
            }
          }
          Write-Host "Smoke OK: installed at $installDir; sidecars litd.exe + waved.exe present."

      - name: Install smoke test (dmg mount + app copy)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle=apps/desktop/src-tauri/target/debug/bundle
          dmg=$(ls "$bundle"/dmg/*.dmg | head -1)
          test -n "$dmg" || { echo "::error::dmg not found in $bundle/dmg"; exit 1; }
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/sovereign-dmg "$dmg" >/dev/null
          trap 'hdiutil detach /tmp/sovereign-dmg >/dev/null 2>&1 || true' EXIT
          cp -R "/tmp/sovereign-dmg/Sovereign Wallet.app" /Applications/
          hdiutil detach /tmp/sovereign-dmg >/dev/null
          trap - EXIT
          app="/Applications/Sovereign Wallet.app"
          test -f "$app/Contents/MacOS/Sovereign Wallet" || {
            echo "::error::main executable missing from installed app"; exit 1; }
          for sidecar in litd waved; do
            test -f "$app/Contents/MacOS/$sidecar" || {
              echo "::error::$sidecar sidecar missing from installed app"; exit 1; }
          done
          # Unsigned by design — record the codesign state as smoke evidence.
          codesign -dv "$app" 2>&1 | head -3 || true
          echo "Smoke OK: app installed at $app with litd + waved sidecars."

      - name: Smoke — bundle inventory (Linux best-effort)
        if: runner.os == 'Linux'
        run: find apps/desktop/src-tauri/target/debug/bundle -type f | head -30

  android-dev-build:
    name: Android dev build (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # node_modules must exist before Gradle runs: the RN gradle plugin is
      # included from apps/mobile/node_modules and autolinking invokes the
      # RN CLI from there.
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Smoke — APK contents
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk" || { echo "::error::debug APK not produced"; exit 1; }
          unzip -l "$apk" | grep -E 'classes\d*\.dex|AndroidManifest\.xml' >/dev/null \
            || { echo "::error::APK missing dex/manifest"; exit 1; }
          unzip -l "$apk" | grep 'lib/arm64-v8a/libhermes.so' >/dev/null \
            || { echo "::error::APK missing Hermes runtime (arm64)"; exit 1; }
          ls -la "$apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-wallet-dev-android
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  ios-dev-build:
    name: iOS dev build (simulator, unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build simulator app (unsigned)
        working-directory: apps/mobile/ios
        # Debug configuration loads JS from Metro at runtime — no bundle step
        # needed for a dev build. Signing is disabled: no Apple credentials
        # exist (docs/RELEASE.md); the artifact is for the iOS Simulator.
        run: |
          xcodebuild \
            -workspace SovereignWallet.xcworkspace \
            -scheme SovereignWallet \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build
      - name: Smoke — app bundle contents
        run: |
          app=apps/mobile/ios/build/Build/Products/Debug-iphonesimulator/SovereignWallet.app
          test -f "$app/SovereignWallet" || {
            echo "::error::main binary missing from simulator app"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          du -sh "$app"
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-wallet-dev-ios-simulator
          path: apps/mobile/ios/build/Build/Products/Debug-iphonesimulator/SovereignWallet.app
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
