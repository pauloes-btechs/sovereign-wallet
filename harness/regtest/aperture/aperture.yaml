# Aperture mailbox for the LNC pairing e2e (authenticator disabled — the
# pairing e2e creates throwaway sessions through litd's Sessions RPC; the
# mailbox itself only brokers encrypted streams). TLS is autogenerated by
# aperture on first start; both dialers (litd session client and the LNC
# wasm client) run in devserver mode, which skips certificate verification.
listenaddr: "0.0.0.0:17045"
hashmail:
  enabled: true
authenticator:
  disable: true
sqlite:
  dbfile: "/data/aperture.db"
dbbackend: "sqlite"
