# litd container — integrated mode with the bitcoind full-node backend.
# Demonstrates Mode B's non-default backend option end-to-end. The raw
# embedded-LND RPC is exposed on a distinct port so harness tools speak plain
# LND RPC (TLS + macaroons from the lnd datadir) instead of the litd proxy.
#
# Three keys are load-bearing (verified against litd v0.17.8 source + binary):
# - lnd-mode=integrated: litd DEFAULTS to remote mode (DefaultLndMode =
#   ModeRemote in config.go), in which no embedded LND ever starts and litd
#   instead tries to connect to an external LND — the source of the earlier
#   "could not read lnd TLS cert" failure.
# - network=regtest: litd's own network flag drives the embedded LND's chain
#   selection. Setting lnd.bitcoin.regtest directly conflicts with litd's
#   injected mainnet default ("network params can't be used together").
# - autopilot.disable=true: the autopilot client only has server addresses
#   for mainnet/testnet; on other networks start() aborts with "no autopilot
#   server address specified" BEFORE the embedded LND is ever launched.

# litd refuses to boot without a UI password (verified: exits 1 with "could
# not read UI password" on v0.17.8) — local-only throwaway, never a real secret.
uipassword=harness-regtest-password

lnd-mode=integrated
network=regtest
autopilot.disable=true

lnd.rpclisten=0.0.0.0:19090
lnd.listen=0.0.0.0:9737

lnd.bitcoin.node=bitcoind
lnd.bitcoind.rpchost=bitcoind:18443
lnd.bitcoind.rpcuser=regtest
lnd.bitcoind.rpcpass=regtest
lnd.bitcoind.zmqpubrawblock=tcp://bitcoind:28332
lnd.bitcoind.zmqpubrawtx=tcp://bitcoind:28333
