# litd container — integrated mode with the bitcoind full-node backend.
# Demonstrates Mode B's non-default backend option end-to-end. The raw
# embedded-LND RPC is exposed on a distinct port so harness tools speak plain
# LND RPC (TLS + macaroons from the lnd datadir) instead of the litd proxy.

lnd.rpclisten=0.0.0.0:19090
lnd.listen=0.0.0.0:9737

lnd.bitcoin.active=true
lnd.bitcoin.regtest=true
lnd.bitcoin.node=bitcoind
lnd.bitcoind.rpchost=bitcoind:18443
lnd.bitcoind.rpcuser=regtest
lnd.bitcoind.rpcpass=regtest
lnd.bitcoind.zmqpubrawblock=tcp://bitcoind:28332
lnd.bitcoind.zmqpubrawtx=tcp://bitcoind:28333
