# lnd-alice — full-node LND against the harness bitcoind.
# Serves as the remote-LND test target (rpcmiddleware enabled, per the
# remote-LND option requirement) and as the channel peer for the sidecar.

[Application Options]
rpclisten=0.0.0.0:10009
listen=0.0.0.0:9735
rpcmiddleware.enable=true

[Bitcoind]
bitcoin.active=true
bitcoin.regtest=true
bitcoin.node=bitcoind
bitcoind.rpchost=bitcoind:18443
bitcoind.rpcuser=regtest
bitcoind.rpcpass=regtest
bitcoind.zmqpubrawblock=tcp://bitcoind:28332
bitcoind.zmqpubrawtx=tcp://bitcoind:28333
